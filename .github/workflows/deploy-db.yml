# Applies new SQL files from supabase/migrations/ to the PRODUCTION database.
# Runs on every push to main that touches migrations, or manually (Actions tab -> Run workflow).
#
# Docs checked 2026-10-27:
#   https://supabase.com/docs/guides/deployment/managing-environments  (link + db push in CI)
#   https://supabase.com/docs/reference/cli/supabase-db-push           (flags; global --yes answers prompts)
# SUPABASE_DB_PASSWORD in the environment lets `supabase link` / `db push` run without a prompt.
name: Deploy database migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Never let two deployments run at the same time; queue instead of cancelling a half-done push.
concurrency:
  group: deploy-db-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets exist
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            eval "val=\${$v:-}"
            if [ -z "$val" ]; then
              echo "::error::GitHub secret $v is missing. See docs/runbook.md, section 'GitHub secrets'."
              exit 1
            fi
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link to the production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Show pending migrations (dry run)
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push --yes
