# Applies new SQL files from supabase/migrations/ to the PRODUCTION database.
# Runs on every push to main that touches migrations, or manually (Actions tab -> Run workflow).
#
# Docs checked 2026-10-27:
#   https://supabase.com/docs/guides/deployment/managing-environments  (link + db push in CI)
#   https://supabase.com/docs/reference/cli/supabase-db-push           (flags; global --yes answers prompts)
# Connects with --db-url (SUPABASE_DB_URL), so no `supabase link` and no Supabase access token are needed.
name: Deploy database migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Never let two deployments run at the same time; queue instead of cancelling a half-done push.
concurrency:
  group: deploy-db-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Session pooler connection string (IPv4), same secret the backup uses. No Supabase access token
      # is needed: `db push --db-url` talks to Postgres directly instead of linking via the Management API.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check secret exists
        run: |
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::GitHub secret SUPABASE_DB_URL is missing. See docs/runbook.md, section 'GitHub secrets'."
            exit 1
          fi

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0 # same as CI db-test; bump deliberately

      - name: Show pending migrations (dry run)
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes
