# CodeQL code scanning: rule-based security analysis (no AI) of the TypeScript code and the workflows.
# Findings appear under Security -> Code scanning and as annotations on pull requests.
# Uses the "advanced setup" (this file); leave GitHub's "default setup" off, the two cannot run together.
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC: catches new queries even without code changes

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v4
      # No build needed: JavaScript/TypeScript and workflows are analysed from source.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
