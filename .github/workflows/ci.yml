name: CI

on:
  pull_request:
  push:
    # phase-* work branches too, so migrations and pgTAP run before a PR exists
    branches: [main, "phase-*/**"]

# Read-only token for every job (pull requests run untrusted code).
permissions:
  contents: read

jobs:
  # Decides `docs_only`. A docs-only PR (every changed file is under docs/ or a root *.md) skips the heavy
  # jobs; skipped jobs report as "skipped", which counts as passing for required checks (unlike a
  # workflow-level paths-ignore, which would leave them pending). Fail safe: on any doubt docs_only=false.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.decide.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, so base...head (merge-base) works for PRs with many commits
          persist-credentials: false # no step pushes; keep the token out of .git/config
      - name: Decide docs_only
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docs_only=false
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE_SHA" ] && [ -n "$HEAD_SHA" ]; then
            if files=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA") \
               && printf '%s\n' "$files" | sh scripts/ci/is-docs-only.sh; then
              docs_only=true
            fi
          fi
          echo "event=$EVENT docs_only=$docs_only"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    # !cancelled(): still run if the `changes` job itself failed (fail safe: run everything)
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes; keep the token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        if: ${{ needs.changes.outputs.docs_only != 'true' }}

  # Runs the SQL in supabase/migrations and the pgTAP tests in supabase/tests on a throwaway local
  # Supabase stack (Docker is available on ubuntu-latest). No secrets needed.
  # Docs checked 2026-10-27: https://supabase.com/docs/reference/cli/supabase-start (-x names),
  # https://github.com/supabase/setup-cli (action v3), https://supabase.com/docs/guides/local-development/testing/overview
  db-test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes; keep the token out of .git/config
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0 # latest release on 2026-10-27; bump deliberately
      # `supabase start` applies supabase/migrations on the fresh database; a failing migration fails this step.
      - name: Start local Supabase (db, auth, rest, kong only)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - name: Run pgTAP tests
        run: supabase test db
      - name: Show status on failure
        if: failure()
        run: |
          supabase status || true
          docker ps -a || true
          docker logs supabase_auth_travel-planner 2>&1 | tail -n 50 || true
      - name: Stop
        if: always()
        run: supabase stop --no-backup || true

  # Playwright E2E (mobile 360 px + desktop 1280 px) against a local Supabase and the production build.
  # External providers are stubbed inside the server process (e2e/stub-fetch.cjs) and AI_ENABLED=false:
  # no secrets and no external calls. See docs/runbook.md "E2E tests" and docs/specs/phase-6-e2e.md.
  e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no step pushes; keep the token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.122.0
      - name: Start local Supabase (db, auth, rest, kong only)
        run: supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,realtime,storage-api,postgres-meta,supavisor
      - name: Export local Supabase URL and demo keys
        run: scripts/e2e/env.sh >> "$GITHUB_ENV"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install system libraries only (browsers restored from cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - run: npm run e2e
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Show Supabase status on failure
        if: failure()
        run: |
          supabase status || true
          docker logs supabase_auth_travel-planner 2>&1 | tail -n 50 || true
      - name: Stop
        if: always()
        run: supabase stop --no-backup || true
